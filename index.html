<div class="wrap" id="app"></div>

<script>
/* ================== 기본 설정 ================== */
const ROLE = 'student';           // 'student' = 학생용 파일, 'teacher' = 선생님용 파일
const TOTAL = 10;                 // 문제 수
// 문제별 배점 [높은 점수, 낮은 점수] — 1~3번 3/1, 4~7번 5/3, 8~9번 7/5, 10번 10/5
const POINTS = [null, [3,1],[3,1],[3,1], [5,3],[5,3],[5,3],[5,3], [7,5],[7,5], [10,5]];
const highPt = n => POINTS[n][0];
const lowPt  = n => POINTS[n][1];
const MAXNUM = 40;                // 학생 번호 최대값

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let db = null;
const configOk = firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes('여기에');
if(configOk){
  try{ firebase.initializeApp(firebaseConfig); db = firebase.database(); }catch(e){ console.error(e); }
}

/* ================== 문제 만들기 ================== */
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = (p) => Math.random() < p;

// 수 하나 = {v: 정수로 바꾼 값, d: 소수 자릿수}  예) 6.3 → {v:63, d:1}, 2.45 → {v:245, d:2}, 12 → {v:12, d:0}
// 소수: 앞 문제는 1보다 작은 소수 위주, 뒤로 갈수록 큰 소수. 끝자리는 0이 아니게.
function dec(d, n){
  const unit = d===1 ? 10 : 100;      // 1 = unit
  let v;
  if(n <= 3)      v = pick(0.7) ? rand(1, unit-1) : rand(unit+1, unit*5-1);
  else if(n <= 6) v = rand(1, unit*6-1);
  else            v = rand(unit+1, unit*10-1);
  if(v % 10 === 0) v += 1;
  return {v, d};
}
const nat1 = () => ({v: rand(2,9), d:0});
// 자연수 일의 자리·십의 자리 섞기: 앞 문제는 한 자리 위주, 뒤로 갈수록 두 자리
function natMix(n){
  const twoDigit = n <= 3 ? pick(0.3) : n <= 6 ? pick(0.5) : pick(0.7);
  return twoDigit ? {v: rand(11,99), d:0} : nat1();
}

// 차시별 문제 종류 (box = 답 칸 너비)
const LESSONS = {
  1: {name:'소수 한 자리 수 × 자연수(한 자리)',           gen:n=>({x:dec(1,n), y:nat1()}),     box:4},
  2: {name:'소수 두 자리 수 × 자연수(한 자리)',           gen:n=>({x:dec(2,n), y:nat1()}),     box:5},
  3: {name:'자연수(한·두 자리) × 소수 한 자리 수',        gen:n=>({x:natMix(n), y:dec(1,n)}),  box:5},
  4: {name:'자연수(한·두 자리) × 소수 두 자리 수',        gen:n=>({x:natMix(n), y:dec(2,n)}),  box:6},
  5: {name:'소수 한 자리 수 × 소수 한 자리 수',           gen:n=>({x:dec(1,n), y:dec(1,n)}),   box:5},
  6: {name:'소수 두 자리 수 × 소수 한 자리 수',           gen:n=>({x:dec(2,n), y:dec(1,n)}),   box:6}
};

function makeQuestions(lesson){
  const L = LESSONS[lesson] || LESSONS[1];
  const qs = [];
  for(let n=1;n<=TOTAL;n++){
    const a = L.gen(n); let b = L.gen(n);
    while(b.x.v===a.x.v && b.y.v===a.y.v) b = L.gen(n);
    const aHigh = Math.random() < 0.5;
    qs.push({a, b, ptA: aHigh?highPt(n):lowPt(n), ptB: aHigh?lowPt(n):highPt(n)});
  }
  return qs;
}

// 수 → 글자  ({v:245,d:2} → "2.45")
function fmtNum(v, d){
  if(!d) return String(v);
  const s = String(v).padStart(d+1,'0');
  return s.slice(0,-d) + '.' + s.slice(-d);
}
const prodOf = p => ({v: p.x.v * p.y.v, d: p.x.d + p.y.d});
const rawAns = p => { const r = prodOf(p); return fmtNum(r.v, r.d); };
// 끝자리 0 생략한 정답
function fmtAns(p){
  let s = rawAns(p);
  if(s.includes('.')) s = s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
// 학생 답 채점 (소수 계산 오차 없이 글자로 비교)
function isCorrect(ans, p){
  const s = String(ans||'').trim().replace(/,/g,'.');
  if(!/^\d+(\.\d+)?$/.test(s)) return false;
  const r = prodOf(p);
  let [ip, fp=''] = s.split('.');
  if(fp.length > r.d){ if(/[^0]/.test(fp.slice(r.d))) return false; fp = fp.slice(0, r.d); }
  fp = fp.padEnd(r.d,'0');
  return parseInt(ip + fp, 10) === r.v;
}

function vertHTML(p, mode, box){ // mode: 'blank' | 'show' | 'input'
  const top = fmtNum(p.x.v, p.x.d), bot = fmtNum(p.y.v, p.y.d), ans = fmtAns(p);
  const w = Math.max(top.length, bot.length + 2);
  const bw = Math.max(box||4, ans.length);
  let boxH;
  if(mode==='show') boxH = `<span class="ansbox show" style="min-width:${bw+.4}ch">${ans}</span>`;
  else if(mode==='input') boxH = `<input class="ansinput" id="ansInput" inputmode="decimal" autocomplete="off" maxlength="8" style="width:${bw+.6}ch">`;
  else boxH = `<span class="ansbox" style="min-width:${bw+.4}ch"> </span>`;
  return `<div class="row">${top.padStart(w,' ')}</div>
          <div class="row">×${bot.padStart(w-1,' ')}</div>
          <div class="line"></div>
          <div class="row" style="text-align:right">${boxH}</div>`;
}
const ptsHTML = (pt, show) => show ? `<span class="val">⭐ ${pt}점</span>` : `배점 <span class="q">?</span>`;
const zeroNote = p => rawAns(p)!==fmtAns(p) ? `${rawAns(p)} → 끝자리 0은 생략해서 ${fmtAns(p)}` : '';
const boxOf = room => (LESSONS[room.lesson]||LESSONS[1]).box;
const lessonTag = room => `${room.lesson||1}차시 · ${(LESSONS[room.lesson]||LESSONS[1]).name}`;

/* ================== 점수 계산 ================== */
function studentNums(room){
  // 파이어베이스가 숫자 키를 배열로 돌려줄 수 있어 빈 칸(null)은 거름
  const st = room.students || {};
  return Object.keys(st).filter(k=>st[k]).map(Number).filter(n=>n>=1).sort((a,b)=>a-b);
}
function gainOf(room, qi, num){
  const r = room.answers && room.answers[qi] && room.answers[qi]['s'+num];
  if(!r || !r.correct) return 0;
  const q = room.questions[qi];
  return r.choice==='A' ? q.ptA : q.ptB;
}
function totalOf(room, num){
  // 공개된 문제까지만 합산
  const upto = room.phase==='question' ? room.qi-1 : room.qi;
  let s = 0;
  for(let i=0;i<=upto && i<TOTAL;i++) s += gainOf(room,i,num);
  return s;
}
function ranking(room){
  const list = studentNums(room).map(n=>({n, s: totalOf(room,n)}));
  list.sort((x,y)=> y.s-x.s || x.n-y.n);
  let rk = 0, prev = null;
  list.forEach((o,idx)=>{ if(o.s!==prev){ rk = idx+1; prev = o.s; } o.rank = rk; });
  return list;
}
const medal = r => ['🥇','🥈','🥉'][r-1] || r;

/* ================== 공통 화면 ================== */
function progressHTML(qi){
  return Array.from({length:TOTAL},(_,i)=>`<div class="dot ${i<qi?'done':''} ${i===qi?'now':''}">${i+1}</div>`).join('');
}

function showHome(){
  if(!configOk || !db){
    app.innerHTML = `<div class="center"><h1 class="hero">⚙️ 설정이 필요해요</h1>
      <div class="panel"><p style="font-size:19px;line-height:1.7">index.html 파일 위쪽의 <b>firebaseConfig</b> 부분에 파이어베이스 설정값을 붙여 넣어 주세요.<br>
      특히 <b>databaseURL</b>이 꼭 있어야 합니다.</p></div></div>`;
    return;
  }
  const t = store.get('dm_teacher_room');
  const s = store.get('dm_student');
  if(ROLE==='teacher'){
    app.innerHTML = `<div class="center">
      <div class="jua" style="font-size:22px;color:var(--a)">5학년 수학 · 소수의 곱셈 · 선생님용</div>
      <h1 class="hero">소수 × 자연수<br>골라 풀기 대작전!</h1>
      <div class="controls">
        <button class="btn-main" id="newRoom">새 게임 만들기 ▶</button>
        ${t ? `<button class="btn-ghost" id="resumeT">방 ${t} 이어서 진행</button>`:''}
      </div></div>`;
    $('newRoom').onclick = teacherSetup;
    if(t) $('resumeT').onclick = ()=> teacherEnter(t);
    return;
  }
  if(ROLE==='student'){
    studentJoinScreen();
    if(s){ try{ const o = JSON.parse(s); $('code').value = o.code; $('num').value = o.num; }catch(e){} }
    return;
  }
  app.innerHTML = `<div class="center">
    <div class="jua" style="font-size:22px;color:var(--a)">5학년 수학 · 소수의 곱셈</div>
    <h1 class="hero">소수 × 자연수<br>골라 풀기 대작전!</h1>
    <p class="sub">A와 B 중 한 문제를 골라 풀어요. 배점은 정답과 함께 공개!</p>
    <div class="roles">
      <button class="role s" id="goStudent">🙋 학생</button>
      <button class="role t" id="goTeacher">🧑‍🏫 선생님</button>
    </div>
    ${t ? `<div class="controls"><button class="btn-ghost" id="resumeT">선생님: 방 ${t} 이어서 진행</button></div>`:''}
    ${s ? `<div class="controls"><button class="btn-ghost" id="resumeS">학생: 방 ${JSON.parse(s).code} · ${JSON.parse(s).num}번으로 다시 들어가기</button></div>`:''}
  </div>`;
  $('goStudent').onclick = studentJoinScreen;
  $('goTeacher').onclick = teacherSetup;
  if(t) $('resumeT').onclick = ()=> teacherEnter(t);
  if(s) $('resumeS').onclick = ()=>{ const o = JSON.parse(s); studentEnter(o.code, o.num); };
}

/* ================== 선생님 ================== */
let tRef = null, tKey = '';
let selLesson = +(store.get('dm_lesson')||1) || 1;

function teacherSetup(){
  let ptRows = '';
  for(let n=1;n<=TOTAL;n++) ptRows += `<span>${n}번: ${highPt(n)}점 / ${lowPt(n)}점</span>`;
  app.innerHTML = `<div class="center">
    <h1 class="hero">새 게임 만들기</h1>
    <div class="panel">
      <label style="margin-top:0">차시 고르기</label>
      <div class="lessons" id="lessons">${Object.keys(LESSONS).map(k=>`<button class="lesson ${+k===selLesson?'on':''}" data-l="${k}"><b>${k}차시</b>${LESSONS[k].name}</button>`).join('')}</div>
      <label>예시 문제</label>
      <div id="sample" style="font-family:'Courier New',monospace;font-weight:700;font-size:22px"></div>
      <div class="switch"><input type="checkbox" id="showPts"><label for="showPts" style="margin:0;font-family:'Gowun Dodum';font-size:18px">배점을 문제와 함께 미리 보여주기 (끄면 정답 공개 때 깜짝 공개)</label></div>
      <label>진행 방법</label>
      <ol class="ruleslist">
        <li>학생은 방 코드와 <b>번호</b>로 들어와요.</li>
        <li>문제마다 A, B 중 <b>한 문제만</b> 골라 답을 제출해요.</li>
        <li>선생님이 <b>정답 공개</b>를 누르면 모든 화면에 정답·배점·결과가 나와요. (자동 채점)</li>
        <li>선생님이 <b>다음 문제</b>를 눌러야 학생 화면도 넘어가요.</li>
      </ol>
      <label>문제별 배점 (높은 점수가 A일지 B일지는 매번 랜덤)</label>
      <div class="pt-table">${ptRows}</div>
    </div>
    <div class="controls"><button class="btn-ghost" id="back">← 처음으로</button><button class="btn-main" id="create">방 만들기</button></div>
    <div class="msg" id="msg"></div>
  </div>`;
  const showSample = ()=>{
    const L = LESSONS[selLesson];
    $('sample').textContent = [1,5,9].map(n=>{ const p=L.gen(n); return `${fmtNum(p.x.v,p.x.d)} × ${fmtNum(p.y.v,p.y.d)}`; }).join('  ／  ');
  };
  showSample();
  $('lessons').onclick = e=>{
    const b = e.target.closest('.lesson'); if(!b) return;
    selLesson = +b.dataset.l; store.set('dm_lesson', selLesson);
    document.querySelectorAll('.lesson').forEach(x=>x.classList.toggle('on', +x.dataset.l===selLesson));
    showSample();
  };
  $('back').onclick = showHome;
  $('create').onclick = async ()=>{
    $('create').disabled = true;
    try{
      let code, tries = 0;
      do{
        code = String(rand(1000,9999));
        const snap = await db.ref('rooms/'+code+'/created').get();
        if(!snap.exists()) break;
      }while(++tries < 20);
      await db.ref('rooms/'+code).set({
        created: Date.now(), phase:'lobby', qi:0,
        lesson: selLesson, showPts: $('showPts').checked, questions: makeQuestions(selLesson)
      });
      store.set('dm_teacher_room', code);
      teacherEnter(code);
    }catch(e){
      $('msg').textContent = '방을 만들지 못했어요. 파이어베이스 설정과 규칙을 확인해 주세요. ('+e.message+')';
      $('create').disabled = false;
    }
  };
}

function teacherEnter(code){
  if(tRef) tRef.off();
  tKey = '';
  tRef = db.ref('rooms/'+code);
  tRef.on('value', snap=>{
    const room = snap.val();
    if(!room){ store.del('dm_teacher_room'); showHome(); return; }
    room.code = code;
    renderTeacher(room);
  });
}

let tRoom = null;
function renderTeacher(room){
  tRoom = room;
  const key = room.phase + '-' + room.qi;
  const fresh = key !== tKey; tKey = key;
  const nums = studentNums(room);

  if(room.phase==='lobby'){
    if(fresh){
      app.innerHTML = `<div class="center">
        <div class="sub" style="margin:0">학생용 주소에 들어와 방 코드와 번호를 입력하세요</div>
        <div class="code">${room.code}</div>
        <div class="jua" style="font-size:24px;color:var(--a)">${lessonTag(room)}</div>
        <h2 class="jua" style="margin:14px 0 0">들어온 학생 <span id="cnt">0</span>명</h2>
        <div class="joined" id="joined"></div>
        <div class="controls"><button class="btn-ghost" id="home">← 처음으로</button><button class="btn-main" id="startGame">게임 시작 ▶</button></div>
      </div>`;
      $('home').onclick = ()=>{ tRef.off(); showHome(); };
      $('startGame').onclick = ()=> tRef.update({phase:'question', qi:0});
    }
    $('cnt').textContent = nums.length;
    $('joined').innerHTML = nums.map(n=>`<div class="num">${n}번</div>`).join('') || '<span style="color:var(--muted)">아직 아무도 없어요</span>';
    return;
  }

  if(room.phase==='end'){
    if(!fresh) { /* 점수 변경 반영 */ }
    const rk = ranking(room);
    app.innerHTML = `<div class="center" style="max-width:1100px">
      <h1 class="hero">🏆 최종 결과</h1>
      <ul class="rank">${rk.slice(0,3).map(o=>`<li><span class="medal">${medal(o.rank)}</span>${o.n}번<span class="sc">${o.s}점</span></li>`).join('')}</ul>
      <ul class="rank compact">${rk.slice(3).map(o=>`<li><span class="medal">${o.rank}</span>${o.n}번<span class="sc">${o.s}점</span></li>`).join('')}</ul>
      <div class="controls"><button class="btn-ghost" id="home">처음으로</button><button class="btn-main" id="again">새 문제로 다시 하기 ↻</button></div>
    </div>`;
    $('home').onclick = ()=>{ tRef.off(); showHome(); };
    $('again').onclick = ()=> tRef.update({phase:'lobby', qi:0, questions: makeQuestions(room.lesson), answers:null});
    return;
  }

  const q = room.questions[room.qi];
  const rev = room.phase==='reveal';
  const ans = (room.answers && room.answers[room.qi]) || {};

  if(fresh){
    app.innerHTML = `
      <div class="topbar">
        <h2 class="qtitle">${room.qi+1}번 문제 <span class="ltag">${lessonTag(room)}</span></h2>
        <div class="progress">${progressHTML(room.qi)}</div>
        <div class="roomtag">방 코드 ${room.code}</div>
      </div>
      <div class="duel">
        <div class="pcard A"><div class="tag">A</div>
          <div class="points">${ptsHTML(q.ptA, rev||room.showPts)}</div>
          <div class="vert">${vertHTML(q.a, rev?'show':'blank', boxOf(room))}</div>
          <div class="note">${rev?zeroNote(q.a):''}</div></div>
        <div class="vs">VS</div>
        <div class="pcard B"><div class="tag">B</div>
          <div class="points">${ptsHTML(q.ptB, rev||room.showPts)}</div>
          <div class="vert">${vertHTML(q.b, rev?'show':'blank', boxOf(room))}</div>
          <div class="note">${rev?zeroNote(q.b):''}</div></div>
      </div>
      <p class="hint">${rev ? (q.ptA>q.ptB?'이번엔 A가 고득점! 🎉':'이번엔 B가 고득점! 🎉') : 'A, B 중 한 문제를 골라 풀어 제출하세요!'}</p>
      <div class="controls">
        ${rev ? `<button class="btn-main" id="nextBtn">${room.qi===TOTAL-1?'최종 결과 보기 🏆':'다음 문제로 ▶'}</button>`
              : `<button class="btn-main" id="revealBtn">정답 공개 🔍</button>`}
      </div>
      <div class="status">
        <h3><span id="stTitle"></span><span class="stats" id="stats"></span></h3>
        <div class="grid" id="grid"></div>
        ${rev?'<p style="color:var(--muted);font-size:15px;margin:10px 0 0">칸을 누르면 정답/오답을 바꿀 수 있어요 (채점 실수 수정용)</p>':''}
      </div>
      ${rev?`<div class="status"><h3>현재 순위</h3><ul class="rank compact" id="liveRank" style="margin:0"></ul></div>`:''}`;
    if(rev){
      $('nextBtn').onclick = ()=>{
        if(room.qi>=TOTAL-1) tRef.update({phase:'end'});
        else tRef.update({phase:'question', qi: room.qi+1});
        window.scrollTo({top:0});
      };
      $('grid').onclick = e=>{
        const c = e.target.closest('.cell[data-n]'); if(!c) return;
        const n = c.dataset.n;
        const latest = (tRoom.answers && tRoom.answers[tRoom.qi]) || {};
        const cur = latest['s'+n];
        if(cur) tRef.child(`answers/${room.qi}/s${n}/correct`).set(!cur.correct);
      };
    }else{
      $('revealBtn').onclick = async ()=>{
        $('revealBtn').disabled = true;
        const snap = await tRef.child('answers/'+room.qi).get();
        const cur = snap.val() || {};
        const upd = {};
        Object.keys(cur).forEach(k=>{
          const r = cur[k];
          upd[`answers/${room.qi}/${k}/correct`] = isCorrect(r.ans, r.choice==='A'?q.a:q.b);
        });
        upd.phase = 'reveal';
        tRef.update(upd);
      };
    }
  }

  // 상태 갱신
  const submitted = nums.filter(n=>ans['s'+n]);
  if(!rev){
    $('stTitle').textContent = `제출 현황 ${submitted.length} / ${nums.length}명`;
    $('stats').innerHTML = '';
    $('grid').innerHTML = nums.map(n=>`<div class="cell ${ans['s'+n]?'sub':''}">${n}번<small>${ans['s'+n]?'제출':'…'}</small></div>`).join('');
  }else{
    let aC=0,aO=0,bC=0,bO=0;
    submitted.forEach(n=>{ const r=ans['s'+n]; if(r.choice==='A'){aC++; if(r.correct)aO++;} else {bC++; if(r.correct)bO++;} });
    $('stTitle').textContent = '채점 결과';
    $('stats').innerHTML = `<span style="color:var(--a)">A 선택 ${aC}명 · 정답 ${aO}명</span><span style="color:var(--b)">B 선택 ${bC}명 · 정답 ${bO}명</span><span>미제출 ${nums.length-submitted.length}명</span>`;
    $('grid').innerHTML = nums.map(n=>{
      const r = ans['s'+n];
      if(!r) return `<div class="cell none">${n}번<small>미제출</small></div>`;
      return `<div class="cell ${r.correct?'ok':'no'}" data-n="${n}">${n}번<small>${r.choice} · ${escapeHTML(r.ans)} ${r.correct?'⭕':'❌'}</small></div>`;
    }).join('');
    const rk = ranking(room);
    $('liveRank').innerHTML = rk.map(o=>`<li><span class="medal">${medal(o.rank)}</span>${o.n}번<span class="sc">${o.s}점</span></li>`).join('');
  }
}
function escapeHTML(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================== 학생 ================== */
let sRef = null, sKey = '', sCode = '', sNum = 0, sChoice = null, sDraft = '';

function studentJoinScreen(){
  let nums = '';
  app.innerHTML = `<div class="center">
    <h1 class="hero">🙋 게임 참가</h1>
    <div class="panel">
      <label>방 코드 (선생님 화면의 숫자 4개)</label>
      <input class="txt" id="code" inputmode="numeric" maxlength="4" autocomplete="off">
      <label>내 번호</label>
      <input class="txt" id="num" inputmode="numeric" maxlength="2" autocomplete="off">
      <div class="msg" id="msg"></div>
    </div>
    <div class="controls"><button class="btn-ghost" id="back">← 처음으로</button><button class="btn-main" id="join">들어가기 ▶</button></div>
  </div>`;
  $('back').onclick = showHome;
  if(ROLE==='student') $('back').remove();
  $('join').onclick = async ()=>{
    const code = $('code').value.trim(), num = parseInt($('num').value,10);
    if(!/^\d{4}$/.test(code)){ $('msg').textContent='방 코드 숫자 4개를 입력하세요.'; return; }
    if(!(num>=1 && num<=MAXNUM)){ $('msg').textContent=`번호는 1~${MAXNUM} 사이로 입력하세요.`; return; }
    $('join').disabled = true;
    try{
      const snap = await db.ref('rooms/'+code+'/created').get();
      if(!snap.exists()){ $('msg').textContent='그런 방이 없어요. 코드를 다시 확인하세요.'; $('join').disabled=false; return; }
      await db.ref(`rooms/${code}/students/${num}`).set(true);
      store.set('dm_student', JSON.stringify({code, num}));
      studentEnter(code, num);
    }catch(e){ $('msg').textContent='접속하지 못했어요. ('+e.message+')'; $('join').disabled=false; }
  };
}

function studentEnter(code, num){
  if(sRef) sRef.off();
  sCode = code; sNum = num; sKey = '';
  db.ref(`rooms/${code}/students/${num}`).set(true);
  sRef = db.ref('rooms/'+code);
  sRef.on('value', snap=>{
    const room = snap.val();
    if(!room){ store.del('dm_student'); showHome(); return; }
    renderStudent(room);
  });
}

function myBar(room){
  return `<div class="mybar"><span>${sNum}번</span><span>내 점수 <b style="color:var(--a)">${totalOf(room,sNum)}</b>점</span></div>`;
}

function renderStudent(room){
  const key = room.phase + '-' + room.qi;
  const fresh = key !== sKey;
  if(fresh){ sKey = key; sChoice = null; sDraft = ''; }

  if(room.phase==='lobby'){
    app.innerHTML = `<div class="center">${myBar(room)}
      <div class="jua" style="font-size:22px;color:var(--a)">${lessonTag(room)}</div>
      <h1 class="hero">👀 준비 완료!</h1>
      <p class="sub">선생님이 게임을 시작할 때까지 기다려요.</p></div>`;
    return;
  }
  if(room.phase==='end'){
    const rk = ranking(room); const me = rk.find(o=>o.n===sNum);
    app.innerHTML = `<div class="center">
      <h1 class="hero">🏆 최종 결과</h1>
      <div class="result ok"><div class="big">${me?me.rank:'-'}등 · ${me?me.s:0}점</div><div class="small">${rk.length}명 중</div></div>
      <ul class="rank">${rk.slice(0,5).map(o=>`<li class="${o.n===sNum?'me':''}"><span class="medal">${medal(o.rank)}</span>${o.n}번<span class="sc">${o.s}점</span></li>`).join('')}</ul>
    </div>`;
    return;
  }

  const q = room.questions[room.qi];
  const mine = room.answers && room.answers[room.qi] && room.answers[room.qi]['s'+sNum];

  if(room.phase==='reveal'){
    const rk = ranking(room); const me = rk.find(o=>o.n===sNum);
    let res;
    if(!mine) res = `<div class="result none"><div class="big">제출하지 않았어요</div><div class="small">다음 문제는 꼭 도전해요!</div></div>`;
    else if(mine.correct){
      const g = mine.choice==='A'?q.ptA:q.ptB;
      res = `<div class="result ok"><div class="big">⭕ 정답! +${g}점</div><div class="small">${mine.choice} 문제 · 내 답 ${escapeHTML(mine.ans)}</div></div>`;
    }else res = `<div class="result no"><div class="big">❌ 아쉬워요! 0점</div><div class="small">${mine.choice} 문제 · 내 답 ${escapeHTML(mine.ans)}</div></div>`;
    app.innerHTML = `${myBar(room)}
      <div class="topbar"><h2 class="qtitle">${room.qi+1}번 정답 <span class="ltag">${lessonTag(room)}</span></h2><div class="progress">${progressHTML(room.qi)}</div></div>
      ${res}
      <p class="hint">지금 ${me?me.rank:'-'}등 / ${rk.length}명 · 선생님이 넘길 때까지 기다려요</p>
      <div class="duel">
        <div class="pcard A ${mine&&mine.choice==='A'?'sel':''}"><div class="tag">A</div><div class="points">${ptsHTML(q.ptA,true)}</div><div class="vert">${vertHTML(q.a,'show',boxOf(room))}</div><div class="note">${zeroNote(q.a)}</div></div>
        <div class="vs">VS</div>
        <div class="pcard B ${mine&&mine.choice==='B'?'sel':''}"><div class="tag">B</div><div class="points">${ptsHTML(q.ptB,true)}</div><div class="vert">${vertHTML(q.b,'show',boxOf(room))}</div><div class="note">${zeroNote(q.b)}</div></div>
      </div>
`;
    return;
  }

  // 문제 풀기 단계
  if(mine && !fresh && sChoice===null && $('editBtn')) return; // 제출 완료 화면 유지
  if(mine && sChoice===null){
    app.innerHTML = `${myBar(room)}
      <div class="topbar"><h2 class="qtitle">${room.qi+1}번 문제 <span class="ltag">${lessonTag(room)}</span></h2><div class="progress">${progressHTML(room.qi)}</div></div>
      <div class="result ok" style="margin-top:30px"><div class="big">✅ 제출 완료!</div>
        <div class="small">${mine.choice} 문제 · 내 답 <b>${escapeHTML(mine.ans)}</b></div>
        <div class="small" style="color:var(--muted)">선생님이 정답을 공개할 때까지 기다려요</div></div>
      <div class="controls"><button class="btn-ghost" id="editBtn">답 고치기</button></div>`;
    $('editBtn').onclick = ()=>{ sChoice = mine.choice; sDraft = mine.ans; drawPick(room); };
    return;
  }
  if(fresh || !$('submitBtn')) drawPick(room);
}

function drawPick(room){
  const q = room.questions[room.qi];
  const card = (L, p, pt) => `
    <div class="pcard ${L} ${sChoice===L?'sel':''} ${sChoice&&sChoice!==L?'dim':''}" data-c="${L}">
      <div class="tag">${L}</div>
      <div class="points">${ptsHTML(pt, room.showPts)}</div>
      <div class="vert">${vertHTML(p, sChoice===L?'input':'blank', boxOf(room))}</div>
    </div>`;
  app.innerHTML = `${myBar(room)}
    <div class="topbar"><h2 class="qtitle">${room.qi+1}번 문제 <span class="ltag">${lessonTag(room)}</span></h2><div class="progress">${progressHTML(room.qi)}</div></div>
    <div class="duel pick" id="duel">${card('A',q.a,q.ptA)}<div class="vs">VS</div>${card('B',q.b,q.ptB)}</div>
    <p class="hint">${sChoice ? `${sChoice} 문제를 골랐어요. 답을 쓰고 제출하세요!` : '풀고 싶은 문제를 눌러서 고르세요!'}</p>
    <div class="controls"><button class="btn-main" id="submitBtn" ${sChoice?'':'disabled'}>제출하기 ✔</button></div>
    <div class="msg" id="msg" style="text-align:center"></div>`;
  $('duel').onclick = e=>{
    const c = e.target.closest('.pcard'); if(!c || e.target.id==='ansInput') return;
    const inp = $('ansInput'); if(inp) sDraft = inp.value;
    if(sChoice !== c.dataset.c){ sChoice = c.dataset.c; sDraft = ''; drawPick(room); }
  };
  const inp = $('ansInput');
  if(inp){
    inp.value = sDraft;
    inp.focus();
    inp.oninput = ()=>{ sDraft = inp.value; };
    inp.onkeydown = e=>{ if(e.key==='Enter') $('submitBtn').click(); };
  }
  $('submitBtn').onclick = async ()=>{
    const v = ($('ansInput')||{}).value || '';
    const clean = v.trim().replace(/,/g,'.');
    if(!/^\d+(\.\d+)?$/.test(clean)){ $('msg').textContent = '숫자로 답을 써 주세요. (예: 3.6)'; return; }
    $('submitBtn').disabled = true;
    try{
      await db.ref(`rooms/${sCode}/answers/${room.qi}/s${sNum}`).set({choice:sChoice, ans:clean});
      sChoice = null; sDraft = '';
      // 화면은 실시간 갱신으로 '제출 완료'로 바뀜
    }catch(e){ $('msg').textContent='제출하지 못했어요. 다시 눌러 주세요.'; $('submitBtn').disabled=false; }
  };
}

showHome();
</script>
</body>
</html>
